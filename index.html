<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B2D5E">
<title>Đào tạo, tư vấn, phát triển giải pháp Y tế số — IP Group × MedTech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>
/* Áp theme/ngôn ngữ trước khi vẽ để tránh nháy màn hình */
(function(){ try{ var s=JSON.parse(localStorage.getItem("ipg_medtech_training_v1")||"{}"); var th=s.theme||((window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"); document.documentElement.setAttribute("data-theme",th); if(s.lang) document.documentElement.lang=s.lang; }catch(e){} })();
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
} }
</script>
<style>
:root{
  --brand:#0B2D5E; --brand-2:#123F7A;         /* nền thương hiệu: sidebar, nút, header bảng */
  --navy:#0B2D5E; --navy-2:#123F7A; --navy-l:#EAF0FA;  /* chữ nhấn & nền nhạt */
  --gold:#B8901F; --gold-2:#D9AE36; --gold-l:#FBF5E3; --gold-ink:#7A5B0C;
  --teal:#0E7C86; --teal-l:#E2F3F4;
  --green:#15803D; --green-l:#E3F5E8; --green-b:#B7E2C3;
  --red:#B42318; --red-l:#FDECEA;
  --amber:#B45309; --amber-l:#FEF3C7;
  --purp:#6D28D9; --purp-l:#F1ECFD;
  --ink:#16202E; --ink-2:#465467; --ink-3:#7A8698;
  --line:#E2E7EF; --bg:#F5F7FB; --card:#FFFFFF; --card-2:#FAFBFD; --input:#FFFFFF;
  --side-ink:#DCE6F5; --side-mute:#8FA6C8;
  --r:14px; --sh:0 1px 2px rgba(16,32,60,.06),0 4px 14px rgba(16,32,60,.06);
  --hdr:60px;
  color-scheme:light;
}
[data-theme="dark"]{
  --brand:#0C1E38; --brand-2:#1C3A66;
  --navy:#9CC0F5; --navy-2:#B9D3FA; --navy-l:#16294A;
  --gold:#D9AE36; --gold-2:#E8C25A; --gold-l:#2E2610; --gold-ink:#F0CF73;
  --teal:#3CC2CC; --teal-l:#0F2F34;
  --green:#4ADE80; --green-l:#0F2A1B; --green-b:#1E5235;
  --red:#F87171; --red-l:#3A1515;
  --amber:#FBBF24; --amber-l:#33260A;
  --purp:#C4B5FD; --purp-l:#251B42;
  --ink:#E6ECF5; --ink-2:#A9B6C9; --ink-3:#7C8AA0;
  --line:#253349; --bg:#0A1220; --card:#111C2E; --card-2:#14213A; --input:#0E1829;
  --side-ink:#C9D6EA; --side-mute:#6F86A8;
  --sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14.5px;line-height:1.55;transition:background .2s,color .2s}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--navy-2);overflow-wrap:anywhere}
.card,.kpi,.notice,.modcard,.session{overflow-wrap:break-word}
table.t td{overflow-wrap:anywhere}
.mono{font-family:'JetBrains Mono',monospace}
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.i-ok{color:var(--green)} .i-no{color:var(--red)} .i-warn{color:var(--amber)} .i-mute{color:var(--ink-3)}

/* ===== Logo plate: logo luôn trên nền trắng để đúng nhận diện ở cả 2 theme ===== */
.plate{display:inline-flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:5px 10px;border:1px solid rgba(0,0,0,.06)}
.plate img{display:block}
.plate .x{color:#8A94A6;font-weight:300}
.plate svg.mt{display:block;width:auto}

/* ===== Brand bar ===== */
.brandbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:14px;padding:8px 18px;padding-top:max(8px,env(safe-area-inset-top));min-height:var(--hdr);box-shadow:0 2px 10px rgba(11,45,94,.06)}
.brandbar .plate img{height:34px}.brandbar .plate svg.mt{height:34px}
.brand-title{flex:1;min-width:0}
.brand-title b{display:block;color:var(--navy);font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-title span{font-size:12px;color:var(--ink-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-meta{font-size:12px;color:var(--ink-2);text-align:right;line-height:1.35;flex-shrink:0}
.brand-meta b{color:var(--navy)}
.brand-meta a{color:var(--navy);font-weight:600}
.tools{display:flex;gap:6px;flex-shrink:0}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--navy);border-radius:9px;padding:7px 10px;cursor:pointer;font-weight:700;font-size:12.5px;min-height:36px}
.tbtn:hover{background:var(--navy-l)}
.tbtn .seg{opacity:.45}.tbtn .seg.on{opacity:1}
.menu-btn{display:none}

/* ===== Layout ===== */
.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - var(--hdr))}
.side{background:var(--brand);color:var(--side-ink);padding:14px 12px 24px;position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));overflow:auto}
.side h6{margin:16px 10px 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-mute);font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--side-ink);text-decoration:none;font-size:13.5px;border:0;background:none;width:100%;text-align:left;line-height:1.3;min-height:40px}
.nav-item:hover{background:rgba(255,255,255,.07)}
.nav-item.active{background:linear-gradient(90deg,rgba(217,174,54,.25),rgba(217,174,54,.05));color:#fff;box-shadow:inset 3px 0 0 var(--gold-2)}
.nav-item .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.08);color:#9FD8E0;flex-shrink:0}
.nav-item.active .ic{background:rgba(217,174,54,.22);color:#F5D77E}
.nav-item .ic svg.i{width:18px;height:18px}
.nav-item .ext{margin-left:auto;opacity:.6}
.side .side-foot{margin-top:18px;padding:12px;border-radius:10px;background:rgba(255,255,255,.06);font-size:12px;line-height:1.55}
.side .side-foot b{color:#fff}
.side .side-foot a{color:var(--gold-2)}
.main{padding:22px 28px 60px;min-width:0}
.scrim{display:none}

/* ===== View header ===== */
.vhead{display:flex;align-items:flex-start;gap:16px;justify-content:space-between;margin-bottom:18px}
.vhead h1{margin:0;font-size:24px;color:var(--navy);line-height:1.25;display:flex;gap:10px;align-items:center}
.vhead h1 .hic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--teal-l);color:var(--teal);flex-shrink:0}
.vhead h1 .hic svg.i{width:22px;height:22px}
.vhead p{margin:6px 0 0;color:var(--ink-2);max-width:880px}
.vhead .plate img{height:22px}.vhead .plate svg.mt{height:24px}

/* ===== Common ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);min-width:0}
.card h3{margin:0 0 10px;font-size:16px;color:var(--navy);display:flex;gap:8px;align-items:center}
.card h4{margin:14px 0 6px;font-size:14px;color:var(--navy)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.mt{margin-top:14px}.mt2{margin-top:22px}
.muted{color:var(--ink-2)}.small{font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--navy-l);color:var(--navy);margin:2px 4px 2px 0}
.chip.gold{background:var(--gold-l);color:var(--gold-ink)}.chip.teal{background:var(--teal-l);color:var(--teal)}
.chip.green{background:var(--green-l);color:var(--green)}.chip.red{background:var(--red-l);color:var(--red)}
.chip.amber{background:var(--amber-l);color:var(--amber)}.chip.purp{background:var(--purp-l);color:var(--purp)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--brand-2);background:var(--brand-2);color:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;min-height:36px;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--card);color:var(--navy);border-color:var(--navy-2)}
.btn.ghost:hover{background:var(--navy-l);filter:none}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px;min-height:30px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi b{display:block;font-size:26px;color:var(--navy);line-height:1.15}
.kpi span{font-size:12px;color:var(--ink-2)}
.kpi .kic{color:var(--teal);margin-bottom:4px}
.notice{border-left:4px solid var(--gold);background:var(--gold-l);padding:10px 14px;border-radius:8px;font-size:13px}
.notice.red{border-color:var(--red);background:var(--red-l)}
.notice.teal{border-color:var(--teal);background:var(--teal-l)}
.notice.navy{border-color:var(--navy-2);background:var(--navy-l)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:var(--brand-2);color:#fff;text-align:left;padding:8px 10px;font-weight:600}
table.t td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top}
table.t tr:nth-child(even) td{background:var(--card-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tab.active{color:var(--navy);border-bottom-color:var(--gold)}
.list{margin:0;padding-left:18px}.list li{margin:3px 0}
.pill-row{display:flex;flex-wrap:wrap;gap:6px}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--navy-2));border-radius:99px}
.hero{background:linear-gradient(120deg,#0B2D5E 0%,#163F7B 60%,#0E5E73 100%);color:#fff;border-radius:18px;padding:26px 28px;position:relative;overflow:hidden}
.hero h2{margin:8px 0 8px;font-size:28px;line-height:1.2}
.hero p{margin:0;color:#D5E1F3;max-width:760px}
.hero .tag{display:inline-block;background:rgba(217,174,54,.2);color:#F5D77E;border:1px solid rgba(217,174,54,.45);padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.hero .motto{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hero .motto span{display:inline-flex;gap:7px;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:10px;font-weight:600;font-size:13px}
.hero .motto svg.i{color:#7FE0E8}
.hero .plate{position:absolute;right:22px;top:20px}
.hero .plate img{height:30px}.hero .plate svg.mt{height:32px}
.hero .cta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hero .cta .btn.ghost{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.35)}
.modcard{border-radius:16px;border:1px solid var(--line);background:var(--card);overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;min-width:0}
.modcard .top{padding:18px;color:#fff;display:flex;gap:14px;align-items:flex-start}
.modcard .top .big{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.15);display:grid;place-items:center;flex-shrink:0}
.modcard .top .big svg.i{width:28px;height:28px}
.modcard .top small{opacity:.85;font-weight:600;letter-spacing:.06em}
.modcard .top h3{margin:4px 0 4px;font-size:19px;color:#fff}
.modcard .body{padding:16px 18px;flex:1}
.modcard .foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.session{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px;cursor:pointer;transition:.15s;position:relative;text-align:left;width:100%}
.session:hover{border-color:var(--navy-2);transform:translateY(-1px)}
.session.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-l)}
.session .no{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.08em}
.session h4{margin:4px 0;font-size:14px;color:var(--navy)}
.session .done{position:absolute;right:10px;top:10px}
.qopt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 12px;margin:6px 0;cursor:pointer;min-height:44px}
.qopt:hover{border-color:var(--navy-2)}
.qopt.correct{border-color:var(--green);background:var(--green-l)}
.qopt.wrong{border-color:var(--red);background:var(--red-l)}
.explain{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--teal-l);font-size:13px}
.field{margin:8px 0}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--input);min-height:40px}
.field textarea{min-height:64px;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:var(--card);cursor:pointer}
.chk input{margin-top:3px;width:18px;height:18px;flex-shrink:0;accent-color:var(--teal)}
.chk.crit{border-left:4px solid var(--red)}
.chk.on{background:var(--green-l);border-color:var(--green-b)}
.modal-bg{position:fixed;inset:0;background:rgba(5,12,24,.6);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:30px 14px;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:16px;max-width:880px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid var(--line)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:3px solid var(--gold)}
.modal .mh .plate img{height:20px}.modal .mh .plate svg.mt{height:22px}
.modal .mb{padding:18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--brand-2);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:200;display:none;max-width:92vw}
.footer{margin-top:40px;padding:16px 0 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap;color:var(--ink-2);font-size:12px}
.footer .plate img{height:24px}.footer .plate svg.mt{height:26px}
.linkcard{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-decoration:none;color:var(--ink);min-width:0;overflow:hidden}
.linkcard .lbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.linkcard .ltitle{display:flex;gap:6px;align-items:flex-start;font-weight:700;color:var(--navy);line-height:1.3}
.linkcard .ltitle svg.i{margin-top:.15em}
.linkcard .ldesc{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.linkcard .lurl{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--teal);overflow-wrap:anywhere;word-break:break-word}
.linkcard:hover{border-color:var(--teal)}
.linkcard .lic{width:40px;height:40px;border-radius:10px;background:var(--teal-l);color:var(--teal);display:grid;place-items:center;flex-shrink:0}

/* ===== 3D Lab ===== */
.lab{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}
.lab-view{height:600px;align-self:start;position:relative;background:radial-gradient(circle at 50% 30%,#14304A,#07111D);border-radius:16px;overflow:hidden;border:1px solid #1E3A55;touch-action:none}
.lab-view canvas{display:block;position:absolute;inset:0;z-index:0}
.lab-hud,.lab-bottom,.lab-msg{z-index:2}
.lab-hud{position:absolute;left:12px;top:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
.lab-hud .hud{pointer-events:auto;background:rgba(5,17,29,.78);border:1px solid rgba(83,211,255,.3);color:#DFF8FF;border-radius:12px;padding:8px 12px;font-size:12.5px}
.lab-hud .hud b{color:#fff}
.lab-hud .plate img{height:20px}.lab-hud .plate svg.mt{height:22px}
.lab-tip{position:absolute;display:none;background:rgba(5,17,29,.92);color:#DFF8FF;padding:4px 8px;border-radius:6px;font-size:12px;pointer-events:none;transform:translate(10px,10px);z-index:3}
.lab-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#BFE6F6;text-align:center;padding:30px;font-size:14px}
.lab-bottom{position:absolute;left:12px;bottom:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lab-bottom .btn{background:rgba(5,17,29,.8);border-color:rgba(83,211,255,.4);color:#DFF8FF}
.lab-side .card{padding:14px}
.equip-btn{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 10px;margin:5px 0;cursor:pointer;font-size:13px;min-height:42px}
.equip-btn.active{border-color:var(--teal);background:var(--teal-l)}
.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act-grid button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--navy);min-height:40px}
.act-grid button:hover{background:var(--navy-l)}
.slider{display:grid;grid-template-columns:110px 1fr 64px;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.slider input{width:100%;accent-color:var(--teal)}
.slider .val{font-family:'JetBrains Mono',monospace;font-weight:600;text-align:right}
.slider .val.warn{color:var(--red)}
.loglist{max-height:150px;overflow:auto;font-size:12px;font-family:'JetBrains Mono',monospace;background:#0B1726;color:#BFE6F6;border-radius:10px;padding:8px}
.loglist div{padding:2px 0;border-bottom:1px dashed rgba(191,230,246,.12)}
.status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#F59E0B;margin-right:6px;vertical-align:middle}
.status-dot.good{background:#22C55E}.status-dot.bad{background:#EF4444}

/* ===== Scenario ===== */
.scen-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer;min-height:44px}
.scen-opt.ok{border-color:var(--green);background:var(--green-l)}
.scen-opt.sub{border-color:var(--amber);background:var(--amber-l)}
.scen-opt.crit{border-color:var(--red);background:var(--red-l)}
.alarm{display:flex;align-items:center;gap:10px;background:#1B0D0D;color:#FFB4A8;border:1px solid #7F1D1D;border-radius:10px;padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:13px}
.alarm .blink{width:12px;height:12px;border-radius:50%;background:#EF4444;animation:blink 1s infinite;flex-shrink:0}
@keyframes blink{50%{opacity:.2}}

/* ===== Certificate (luôn nền giấy sáng) ===== */
.cert{border:10px solid #0B2D5E;outline:3px solid #B8901F;outline-offset:-18px;padding:40px 46px;text-align:center;background:#FFFDF7;color:#16202E;position:relative}
.cert .plate{border:0;padding:0;gap:22px;background:transparent}
.cert .plate img{height:44px}.cert .plate svg.mt{height:48px}
.cert h2{font-size:30px;color:#0B2D5E;margin:8px 0 2px;letter-spacing:.04em}
.cert .who{font-size:28px;font-weight:700;color:#B8901F;margin:14px 0 6px}
.cert .sig{display:flex;justify-content:space-between;margin-top:34px;gap:20px;font-size:13px}
.cert .sig div{flex:1}
.cert .sig b{display:block;margin-top:46px;color:#0B2D5E}
.cert .cm{color:#465467}

/* ===== Print ===== */
.print-only{display:none}
@media print{
  :root,[data-theme="dark"]{--bg:#fff;--card:#fff;--ink:#16202E;--navy:#0B2D5E;--line:#ddd}
  .brandbar,.side,.no-print,.tabs,.footer,.toast,.scrim{display:none!important}
  .layout{display:block}.main{padding:0}
  .print-only{display:block}
  body{background:#fff;color:#16202E}
  .modal-bg.open{position:static;display:block;background:none;padding:0}
  .card{box-shadow:none}
}

/* ===== Responsive: desktop lớn → laptop → tablet → điện thoại ===== */
@media (min-width:1600px){ .main{max-width:1500px} }
@media (max-width:1280px){ .brand-meta{display:none} }
@media (max-width:1100px){ .lab{grid-template-columns:1fr} .lab-view{height:480px} }
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:var(--hdr);bottom:0;height:auto;width:280px;max-width:86vw;z-index:70;transform:translateX(-105%);transition:transform .22s;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .side.open{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.35)}
  .scrim.open{display:block;position:fixed;inset:var(--hdr) 0 0 0;background:rgba(5,12,24,.45);z-index:65}
  .menu-btn{display:inline-flex}
  .main{padding:18px 16px 50px}
  .vhead{flex-direction:column}
  .hero .plate{position:static;margin-bottom:12px}
}
@media (max-width:640px){
  :root{--hdr:56px}
  body{font-size:14px}
  .brandbar{gap:8px;padding:6px 10px}
  .brandbar .plate{padding:4px 6px;gap:6px}
  .brandbar .plate img{height:24px}.brandbar .plate svg.mt{height:24px}
  .brandbar .plate .x{display:none}
  .brand-title{display:none}
  .tools{margin-left:auto}
  .tbtn{padding:6px 8px}
  .tbtn .lbl{display:none}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .kpi b{font-size:22px}
  .hero{padding:20px 18px}.hero h2{font-size:22px}
  .vhead h1{font-size:20px}
  .lab-view{height:400px}
  .lab-hud .hud span{display:none}
  .lab-hud .plate{padding:3px 6px}.lab-hud .plate img{height:16px}.lab-hud .plate svg.mt{height:18px}.lab-hud .plate .x{display:none}
  .lab-bottom .btn{padding:5px 8px;font-size:11.5px}
  .slider{grid-template-columns:90px 1fr 60px}
  .cert{padding:22px 16px;border-width:6px}.cert h2{font-size:20px}.cert .who{font-size:21px}.cert .sig{flex-direction:column}
  .modal-bg{padding:0}.modal{border-radius:0;min-height:100%}
  table.t{font-size:12.5px}
}
@media (hover:none){ .session:hover{transform:none} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

/* ===== AUTH · PHÂN QUYỀN · LOGO INNOHEALTH ===== */
body.locked .brandbar,body.locked .layout,body.locked #secBar,body.locked #annBar{display:none!important}
body:not(.locked) .auth-screen{display:none}
.auth-screen{position:fixed;inset:0;z-index:300;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(1200px 600px at 15% -10%,var(--navy-l),transparent 60%),radial-gradient(900px 500px at 100% 110%,var(--teal-l),transparent 60%),var(--bg)}
.auth-card{width:100%;max-width:430px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:18px;box-shadow:0 18px 50px rgba(11,45,94,.18);padding:28px 26px 22px}
.auth-logo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:14px}
.auth-logo .inno-mark{display:block}
.auth-logo h1{margin:0;font-size:17px;line-height:1.35;color:var(--navy)}
.auth-logo .plate{margin-top:2px}
.auth-logo .plate img{height:26px}.auth-logo .plate svg.mt{height:28px}
.secure-line{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--navy-l);color:var(--navy);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;text-align:center;margin:0 0 16px}
.secure-line svg{width:16px;height:16px;flex-shrink:0}
.auth-card .field input{min-height:44px}
.auth-card .pw{position:relative}
.auth-card .pw input{padding-right:64px}
.auth-card .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--navy);font-weight:700;font-size:12px;cursor:pointer;padding:6px 8px}
.auth-card .btn.full{width:100%;justify-content:center;min-height:44px;font-size:14px;margin-top:6px}
.auth-err{display:none;margin-top:10px}
.auth-err.show{display:block}
.auth-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--ink-3)}
.auth-hint{font-size:12px;color:var(--ink-2);margin:6px 0 0;line-height:1.5}
.plate.inno{padding:4px 8px}
.plate.inno .inno-mark{display:block;height:34px;width:34px}
.secbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--navy-l);color:var(--navy);padding:6px 18px;font-size:12.5px;font-weight:700;border-bottom:1px solid var(--line)}
.secbar svg{width:15px;height:15px;flex-shrink:0}
.secbar .sep{opacity:.4}
.secbar .ro{margin-left:auto;color:var(--amber);background:var(--amber-l);border-radius:999px;padding:2px 10px;font-size:11.5px}
.annbar{padding:8px 18px 0}
.userchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);padding:0 4px;max-width:200px}
.userchip .uc-name{font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userchip .chip{margin:0;white-space:nowrap;flex-shrink:0}
.userchip{max-width:260px}
.brand-title b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:1480px){ .brand-meta{display:none} }
.side-acct{display:none;margin-top:14px;padding:10px;border-radius:10px;background:rgba(255,255,255,.06)}
.side-acct .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#fff;font-weight:700;font-size:13px;margin:0 0 6px;padding:0 4px}
.side-acct .chip{margin:0}
@media (max-width:900px){ #pwdBtn,#logoutBtn{display:none} .side-acct{display:block} }
@media (max-width:380px){ .brandbar{gap:5px;padding:6px 8px} .brandbar .plate img{height:19px}.brandbar .plate svg.mt{height:19px} .plate.inno .inno-mark{height:24px;width:24px} .tbtn .seg{font-size:11.5px} }
@media (max-width:640px){ #themeBtn{display:none} .plate.inno{padding:3px 5px} .plate.inno .inno-mark{height:28px;width:28px} .brandbar .plate img{height:22px}.brandbar .plate svg.mt{height:22px} .brandbar .tools .tbtn#langBtn{padding:6px 7px} }
.footer .secline{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--navy)}
.footer .secline .inno-mark{width:26px;height:26px}
.ro-lock{opacity:.45;cursor:not-allowed!important}
.ro-lock:hover{transform:none!important}
input:disabled,select:disabled,textarea:disabled{opacity:.6;cursor:not-allowed}
.rolematrix td,.rolematrix th{vertical-align:top}
.cred{font-family:'JetBrains Mono',monospace;background:var(--navy-l);border-radius:8px;padding:8px 10px;display:inline-block;margin:4px 0;word-break:break-all}
.lib-item{display:flex;gap:12px;align-items:flex-start}
.lib-item .lic{width:38px;height:38px;border-radius:10px;background:var(--teal-l);color:var(--teal);display:grid;place-items:center;flex-shrink:0}
.lib-item .lic svg.i{width:20px;height:20px}
.fchk{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:13.5px}
@media (max-width:900px){ .userchip .uc-name{display:none} .tbtn .lbl2{display:none} .secbar{padding:6px 12px} }
@media (max-width:640px){ .plate.inno .inno-mark{height:26px;width:26px} .userchip{display:none} .auth-card{padding:22px 18px 18px} }
</style>

const M1_QUESTIONS = [
 {s:1,q:"AI trong y tế nên được xem là gì?",o:["Quyết định thay bác sĩ","Công cụ hỗ trợ có giới hạn","Nguồn chẩn đoán cuối cùng","Hồ sơ pháp lý thay bệnh án"],a:1,e:"AI là công cụ hỗ trợ — con người quyết định cuối cùng và chịu trách nhiệm. Luật AI 134/2025/QH15 đặt nguyên tắc con người giám sát, AI không thay thế thẩm quyền và trách nhiệm của con người."},
 {s:1,q:"Câu nào mô tả đúng giới hạn của LLM trong y tế?",o:["LLM luôn chính xác về y khoa","LLM có thể thay bác sĩ chuyên khoa","LLM giỏi tổng hợp nhưng output phải được kiểm chứng","LLM không bao giờ sai"],a:2,e:"LLM giỏi tổng hợp và viết nháp nhưng có thể sinh nội dung sai (hallucination). Mọi nội dung y khoa phải kiểm chứng nguồn."},
 {s:1,q:"Dữ liệu định danh người bệnh có được đưa vào AI công cộng không?",o:["Có, nếu bác sĩ đồng ý","Có, nếu để học tập","Chỉ khi có cơ sở pháp lý, được phê duyệt và bảo đảm an toàn","Không cần kiểm tra"],a:2,e:"Dữ liệu sức khỏe là dữ liệu cá nhân nhạy cảm theo Luật BVDLCN 91/2025/QH15 và NĐ 356/2025/NĐ-CP (thay thế NĐ 13/2023 từ 01/01/2026). Cần cơ sở xử lý hợp pháp, kênh được phê duyệt và biện pháp bảo vệ."},
 {s:1,q:"Trong 5 câu hỏi an toàn, câu nào về TRÁCH NHIỆM?",o:["Công cụ có giao diện đẹp không?","Ai chịu trách nhiệm cuối cùng? Ai được phép override?","Công cụ có miễn phí không?","Prompt có dài không?"],a:1,e:"Câu 4 của checklist: xác định người chịu trách nhiệm cuối cùng và người có quyền chấp nhận/override output AI."},
 {s:1,q:"“Giá trị AI đo trên workflow” nghĩa là gì?",o:["Demo ấn tượng là đủ","Đo trên quy trình thật với chỉ số trước–sau (thời gian, sai sót, sự cố)","Chỉ cần độ chính xác trên tập test của nhà cung cấp","Nhanh hơn nghĩa là đúng hơn"],a:1,e:"Độ chính xác trên tập test của vendor không đảm bảo hiệu quả tại đơn vị. Phải có baseline và chỉ số đo trên quy trình thực."},
 {s:2,q:"Khi AI imaging và lâm sàng mâu thuẫn, ưu tiên đầu tiên là gì?",o:["Chọn AI vì nhanh hơn","Bỏ qua lâm sàng","Xác minh lại dữ liệu, chất lượng ảnh và bối cảnh","In kết quả AI vào hồ sơ"],a:2,e:"Không tự động ưu tiên AI. Xác minh chất lượng ảnh, tiền sử, xét nghiệm; ghi nhận bất đồng."},
 {s:2,q:"False negative trong AI imaging nguy hiểm vì sao?",o:["Gây nhiều can thiệp thừa","Có thể bỏ sót bệnh lý cần xử trí mà không phát cảnh báo","Làm AI chạy chậm","Không ảnh hưởng người bệnh"],a:1,e:"FN không tạo cảnh báo nên dễ tạo cảm giác an toàn giả, dẫn đến chẩn đoán chậm."},
 {s:2,q:"Heatmap trong AI imaging thể hiện điều gì?",o:["Chẩn đoán xác định","Vùng ảnh ảnh hưởng nhiều tới output của mô hình — không phải bằng chứng tổn thương","Vị trí sinh thiết bắt buộc","Mức độ nặng của bệnh"],a:1,e:"Heatmap/saliency là công cụ giải thích kỹ thuật, có thể đánh dấu vùng không liên quan (artifact, chữ đánh dấu phim)."},
 {s:2,q:"Vì sao phải đọc ảnh độc lập TRƯỚC khi mở output AI?",o:["Tiết kiệm thời gian","Giảm anchoring bias và automation bias","Luật cấm xem AI trước","Để AI học từ bác sĩ"],a:1,e:"Xem AI trước dễ bị “neo” vào gợi ý của máy. Đọc độc lập là bước 1 của protocol H-03."},
 {s:2,q:"Confidence score 0.86 của AI có nghĩa là?",o:["Người bệnh có 86% khả năng mắc bệnh","Điểm đầu ra của mô hình; không đồng nghĩa xác suất lâm sàng, phụ thuộc hiệu chuẩn và tỷ lệ hiện mắc","Độ nhạy của mô hình là 86%","AI đúng 86% số ca"],a:1,e:"Điểm số mô hình chỉ diễn giải như xác suất khi đã hiệu chuẩn trên quần thể tương tự. Giá trị dự báo dương còn phụ thuộc tỷ lệ hiện mắc tại đơn vị."},
 {s:3,q:"Trong CDS, “alert fatigue” là gì?",o:["Mệt do trực đêm","Mất cảnh giác do quá nhiều cảnh báo","Máy chủ quá tải","Mất kết nối internet"],a:1,e:"Quá nhiều cảnh báo không đặc hiệu khiến nhân viên bỏ qua cả cảnh báo quan trọng."},
 {s:3,q:"Ba lớp kiểm tra CDS theo thứ tự đúng?",o:["Bối cảnh → Dữ liệu → Trách nhiệm","Dữ liệu → Bối cảnh → Trách nhiệm","Trách nhiệm → Dữ liệu → Bối cảnh","Không cần thứ tự"],a:1,e:"Lớp 1 đúng dữ liệu → Lớp 2 đúng bối cảnh (người bệnh có ngoài quần thể huấn luyện?) → Lớp 3 đúng trách nhiệm (ai duyệt, ai override, ai lưu vết)."},
 {s:3,q:"CDS báo Sepsis khi sinh hiệu nhập trễ 4 giờ và người bệnh đang dùng thuốc hạ sốt. Lỗi chính thuộc lớp nào?",o:["Lớp 1 – dữ liệu (kèm lớp 2 – bối cảnh)","Lớp 3 – trách nhiệm","Không có lỗi","Lỗi phần cứng"],a:0,e:"Dữ liệu trễ và bị nhiễu bởi thuốc → sai dữ liệu đầu vào; thuốc hạ sốt còn thay đổi bối cảnh diễn giải."},
 {s:3,q:"Override note tối thiểu cần ghi?",o:["Chỉ ký tên","Cảnh báo nào – dữ liệu đã xác minh – lý do chấp nhận/bác bỏ – người quyết định – thời điểm","Ảnh chụp màn hình","Không cần ghi"],a:1,e:"Override note là bằng chứng truy vết và dữ liệu để cải tiến ngưỡng cảnh báo."},
 {s:3,q:"Biện pháp giảm alert fatigue phù hợp?",o:["Tắt toàn bộ cảnh báo","Phân tầng mức độ, rà soát tỷ lệ override định kỳ, tinh chỉnh ngưỡng có kiểm soát","Thêm nhiều cảnh báo hơn","Để IT tự quyết"],a:1,e:"Cần quản trị cảnh báo có hội đồng lâm sàng–CNTT, đo tỷ lệ override và tác động."},
 {s:4,q:"Bias trong AI y tế có thể xuất phát từ đâu?",o:["Chỉ từ mô hình","Chỉ từ người dùng","Từ dữ liệu, nhãn, quy trình và điều kiện triển khai","Không tồn tại trong y tế"],a:2,e:"Dữ liệu thiếu đa dạng, nhãn chủ quan, môi trường triển khai khác validation đều tạo bias."},
 {s:4,q:"Theo Luật BVDLCN 91/2025/QH15, dữ liệu sức khỏe thuộc nhóm nào?",o:["Dữ liệu cá nhân cơ bản","Dữ liệu cá nhân nhạy cảm","Dữ liệu công khai","Không thuộc phạm vi điều chỉnh"],a:1,e:"Thông tin sức khỏe thuộc dữ liệu cá nhân nhạy cảm — yêu cầu đồng ý rõ ràng, có thể kiểm chứng và biện pháp bảo vệ tăng cường (NĐ 356/2025/NĐ-CP)."},
 {s:4,q:"Luật Trí tuệ nhân tạo 134/2025/QH15 có hiệu lực từ ngày nào?",o:["01/01/2026","01/03/2026","01/07/2025","10/12/2025"],a:1,e:"Thông qua 10/12/2025, hiệu lực 01/03/2026. Hệ thống AI y tế đã vận hành trước đó có thời hạn chuyển tiếp 18 tháng để hoàn thành nghĩa vụ tuân thủ."},
 {s:4,q:"Điều dưỡng chụp ảnh tổn thương da bằng điện thoại cá nhân và gửi lên app AI bên ngoài. Vấn đề cốt lõi?",o:["Ảnh chưa đủ nét","Xử lý dữ liệu nhạy cảm qua kênh chưa phê duyệt, thiếu đồng ý và không lưu vết","AI chưa đủ giỏi","Không vấn đề nếu không thấy mặt"],a:1,e:"Ảnh tổn thương kèm ngữ cảnh vẫn có thể định danh. Vấn đề là kênh xử lý, cơ sở pháp lý và truy vết — không phải chất lượng AI."},
 {s:4,q:"Khi AI tham gia chăm sóc, người bệnh nên được biết điều gì?",o:["Không cần thông báo","AI đang hỗ trợ việc gì, dữ liệu xử lý ở đâu, ai quyết định cuối cùng và quyền đặt câu hỏi/từ chối khi áp dụng","Chỉ tên nhà cung cấp AI","Chỉ khi AI sai"],a:1,e:"Nguyên tắc minh bạch (Luật AI) và quyền chủ thể dữ liệu (Luật BVDLCN: đồng ý, rút lại đồng ý, phản đối xử lý). Điều khoản áp dụng cụ thể cần đối chiếu khi xây dựng SOP."},
 {s:5,q:"Trong telemedicine, AI phù hợp nhất ở bước nào trước tiên?",o:["Tự quyết định nhập viện","Tóm tắt ghi chú, hỗ trợ thu thập triệu chứng trước khám","Tự thay đổi thuốc","Ký bệnh án"],a:1,e:"Bước trước khám là rủi ro thấp. Quyết định lâm sàng phải do bác sĩ."},
 {s:5,q:"“Kill switch” trong workflow AI telemedicine là gì?",o:["Nút tắt máy tính bác sĩ","Cơ chế dừng/khoanh vùng AI an toàn khi phát hiện sai lệch, chuyển về quy trình thủ công","Xóa toàn bộ dữ liệu","Ngắt mạng bệnh viện"],a:1,e:"Phải xác định trước ai có quyền kích hoạt, tiêu chí kích hoạt và quy trình dự phòng."},

 {s:6,q:"Trong nghiên cứu y khoa, AI có được ghi là tác giả không?",o:["Có","Chỉ khi viết hay","Không — AI không thể chịu trách nhiệm về công trình","Tùy trưởng nhóm"],a:2,e:"Khuyến nghị ICMJE: AI không đáp ứng tiêu chí tác giả; phải khai báo việc sử dụng AI."},

const M1_CASES = [
 {id:"C-01",s:1,title:"Bác sĩ nội trú copy bệnh án vào AI công cộng",sit:"Bác sĩ nội trú copy nguyên văn tóm tắt bệnh án có họ tên, tuổi, chẩn đoán và thuốc đang dùng vào một công cụ AI công cộng để viết lại cho dễ đọc trước giao ban. Bản tóm tắt đẹp và nhanh — nhưng dữ liệu đã rời khỏi hệ thống được phê duyệt.",qs:["Vấn đề là kỹ thuật, quy trình hay pháp lý — hay cả ba?","Nếu vẫn muốn tóm tắt, có những lựa chọn an toàn nào?","Đơn vị cần quy định gì rõ hơn?","Nếu là quản lý, chỉ số nào cần theo dõi?"],note:"Không tranh luận ý định. Tập trung rủi ro hệ thống → chốt: dữ liệu được phép – không được phép – kênh được dùng."},
 {id:"C-02",s:2,title:"AI báo viêm phổi (0.86) nhưng lâm sàng không phù hợp",sit:"AI đọc X-quang ngực báo “nghi viêm phổi thùy dưới phải, confidence 0.86”. Người bệnh sốt nhẹ 1 ngày, không ho, không đau ngực, bạch cầu bình thường, SpO2 98%. Bác sĩ trẻ phân vân có kê kháng sinh theo gợi ý AI.",qs:["Dấu hiệu nào cho thấy AI có thể đang sai?","Bước nào trong quy trình 4 bước quan trọng nhất ở đây?","Nếu không theo AI, cần ghi nhận gì?","Khi nào cần hội chẩn bác sĩ CĐHA?"],note:"Nghi false positive. Lâm sàng là căn cứ chính; ghi override là bắt buộc."},
 {id:"C-03",s:3,title:"CDS báo Sepsis — dữ liệu trễ và nhiễu do thuốc",sit:"Hệ thống CDS phát cảnh báo Sepsis lúc 14h. Kiểm tra: sinh hiệu được nhập lúc 10h (trễ 4 giờ), người bệnh vừa dùng paracetamol nên nhiệt độ hiện tại thấp hơn; nhịp tim tăng sau vận động. Điều dưỡng đề nghị bỏ qua vì “hệ thống hay báo sai”.",qs:["Lỗi thuộc lớp kiểm tra nào?","Có nên bỏ qua cảnh báo không? Vì sao?","Override note cần ghi gì?","Làm sao giảm alert fatigue mà không bỏ sót sepsis thật?"],note:"Lớp 1 + lớp 2. Không bỏ qua — đánh giá lại lâm sàng với dữ liệu mới, ghi override, báo cáo độ trễ dữ liệu."},
 {id:"C-04",s:4,title:"Điều dưỡng gửi ảnh tổn thương da lên AI ngoài hệ thống",sit:"Điều dưỡng dùng điện thoại cá nhân chụp ảnh loét tì đè của người bệnh và tải lên một ứng dụng AI miễn phí để hỏi phân độ. Ảnh có góc chụp lộ vòng tay định danh.",qs:["Những dữ liệu nào đã bị xử lý?","Vi phạm nguyên tắc nào của Luật BVDLCN?","Cây quyết định nhập dữ liệu sẽ dừng ở bước nào?","Đơn vị nên cung cấp giải pháp thay thế gì?"],note:"Dữ liệu sức khỏe nhạy cảm + định danh gián tiếp. Cần kênh được phê duyệt, thiết bị của đơn vị và quy trình đồng ý."},

const DEFAULT_STATE = {
  lang:"vi", theme:null,
  view:"overview", m1Sub:"route", m2Sub:"syllabus", sel:1,
  m1Done:[], m2Done:[], casesSeen:[],
  quiz:{m1:{best:null,last:null}, m2:{best:null,last:null}},
  pre:{m1:null,m2:null}, post:{m1:null,m2:null},
  check25:[], scen:{}, osce:{scores:{},crit:false,assessor:""},

let S = loadState();
function loadState(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ return deepMerge(JSON.parse(JSON.stringify(DEFAULT_STATE)), JSON.parse(raw)); } }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function deepMerge(a,b){ for(const k in b){ if(b[k] && typeof b[k]==="object" && !Array.isArray(b[k]) && a[k] && typeof a[k]==="object" && !Array.isArray(a[k])) deepMerge(a[k],b[k]); else a[k]=b[k]; } return a; }
function save(){
  try{
    /* Chỉ Admin được ghi dữ liệu chương trình. Tài khoản chỉ xem (hoặc chưa đăng nhập) chỉ lưu tùy chọn hiển thị riêng, không đụng tới dữ liệu gốc. */

    localStorage.setItem(STORE_KEY, JSON.stringify(S));
  }catch(e){}
}
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.style.display="block"; clearTimeout(el._h); el._h=setTimeout(()=>el.style.display="none",2600); }
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const pct = (a,b) => b ? Math.round(a*100/b) : 0;

const t = (vi,en) => S.lang==="en" ? en : vi;
function overlay(vi,en){
  if(en===undefined||en===null) return vi;
  if(Array.isArray(vi)) return vi.map((v,i)=>overlay(v, Array.isArray(en)?en[i]:undefined));
  if(vi && typeof vi==="object"){ const o={}; for(const k in vi) o[k]=overlay(vi[k], en[k]); return o; }
  return (typeof en==="string"||typeof en==="number") ? en : vi;
}
let _D=null,_DL=null;
function D(){
  if(_D && _DL===S.lang) return _D; _DL=S.lang;
  if(S.lang!=="en"){ _D={HP:M1_HP,SESS:M1_SESSIONS,Q1:M1_QUESTIONS,CASES:M1_CASES,HO:M1_HANDOUTS,LAWS,SAFE5,PARTS:M2_PARTS,Q2:M2_QUESTIONS,
      C25:M2_CHECK25.map(g=>({g:g.g,items:g.items.map(i=>({txt:i[0],crit:i[1]}))})),
      SCEN:M2_SCENARIOS.map(s=>({...s,steps:s.steps.map(st=>({q:st.q,o:st.o.map(o=>({txt:o[0],typ:o[1],ex:o[2]}))}))})),
      OSCE:OSCE_RUBRIC, FT:FACILITY_TYPES, FMT:Object.fromEntries(Object.entries(FORMATS).map(([k,v])=>[k,v.name])), M2S:M2_SCHEDULE, PKS:PK_SCHEDULE, ORG}; return _D; }
  _D={HP:overlay(M1_HP,EN.HP),SESS:overlay(M1_SESSIONS,EN.M1_SESSIONS),Q1:overlay(M1_QUESTIONS,EN.M1_QUESTIONS),CASES:overlay(M1_CASES,EN.M1_CASES),
    HO:M1_HANDOUTS.map((h,i)=>{ const e=EN.M1_HANDOUTS[i]; return {...h,title:e.title,s:e.s,fields:h.fields.map((f,j)=>({...f,...e.fields[j],t:f.t}))}; }),
    LAWS:overlay(LAWS,EN.LAWS),SAFE5:EN.SAFE5,PARTS:overlay(M2_PARTS,EN.M2_PARTS),Q2:overlay(M2_QUESTIONS,EN.M2_QUESTIONS),
    C25:M2_CHECK25.map((g,gi)=>({g:EN.M2_CHECK25[gi].g,items:g.items.map((i,ii)=>({txt:EN.M2_CHECK25[gi].items[ii],crit:i[1]}))})),
    SCEN:M2_SCENARIOS.map((s,si)=>{ const e=EN.M2_SCENARIOS[si]; return {...s,title:e.title,alarm:e.alarm,ctx:e.ctx,steps:s.steps.map((st,k)=>({q:e.steps[k].q,o:st.o.map((o,j)=>({txt:e.steps[k].o[j][0],typ:o[1],ex:e.steps[k].o[j][1]}))}))}; }),
    OSCE:OSCE_RUBRIC.map((r,i)=>({...r,k:EN.OSCE[i]})), FT:overlay(FACILITY_TYPES,EN.FACILITY_TYPES), FMT:EN.FORMATS, M2S:EN.M2_SCHEDULE, PKS:EN.PK_SCHEDULE, ORG:{...ORG,...EN.ORG}};
  return _D;
}

// ═════════════════════ PROGRESS HELPERS ═════════════════════
function check25Stats(){
  const all = M2_CHECK25.flatMap((g,gi)=>g.items.map((it,ii)=>({id:`${gi}-${ii}`,crit:it[1]})));
  const done = all.filter(x=>S.check25.includes(x.id)).length;
  const critMissing = all.filter(x=>x.crit && !S.check25.includes(x.id)).length;
  return {total:all.length, done, p:pct(done,all.length), critMissing};
}
function scenStats(){
  const done = M2_SCENARIOS.filter(s=>S.scen[s.id] && S.scen[s.id].finished).length;
  const crit = M2_SCENARIOS.reduce((n,s)=>n+((S.scen[s.id]&&S.scen[s.id].crit)||0),0);
  const pts = M2_SCENARIOS.reduce((n,s)=>n+((S.scen[s.id]&&S.scen[s.id].pts)||0),0);
  const max = M2_SCENARIOS.reduce((n,s)=>n+s.steps.length,0);
  return {done,total:M2_SCENARIOS.length,crit,p:pct(pts,max)};
}
function osceScore(){ let s=0; OSCE_RUBRIC.forEach((r,i)=>{ const v=S.osce.scores[i]; if(v!=null) s+= r.w*v/4; }); return Math.round(s); }
function readiness(){
  const q = S.quiz.m2.best ?? 0, c = check25Stats(), sc = scenStats();
  const okQ = q>=80, okC = c.p>=90 && c.critMissing===0, okS = sc.done===sc.total && sc.crit===0;
  const n = [okQ,okC,okS].filter(Boolean).length;
  let level="Beginner", col="red";
  if(n===3){ level="Ready-for-supervised-lab"; col="green"; } else if(n>=2 || (n===1 && q>=60)){ level="Assisted"; col="amber"; }
  return {level,col,okQ,okC,okS,q,c,sc};
}
function m1Progress(){ return pct(S.m1Done.length, 8); }
function m2Progress(){
  const r = readiness();
  const parts = [pct(S.m2Done.length,14), r.c.p, pct(r.sc.done,r.sc.total), Math.min(100,r.q), pct(S.lab.steps.length,6)];
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);
}

function fmtDate(d){ return d.toLocaleDateString(S.lang==="en"?"en-GB":"vi-VN",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"}); }
function buildSlots(startStr, fmt, count){
  const F=FORMATS[fmt]; const out=[]; if(!startStr) return out;
  const d=new Date(startStr+"T00:00:00"); let guard=0;
  while(out.length<count && guard<400){ if(F.days.includes(d.getDay())){ for(const sl of F.slots){ if(out.length<count) out.push({date:new Date(d),from:sl[0],to:sl[1]}); } } d.setDate(d.getDate()+1); guard++; }
  return out;
}
function planSessions(){
  const p=S.plan, d=D(), ft=d.FT[p.type]; let list=[];

    let ids=[1,2,3,4,5,6,7,8];
    if(p.type==="pk") ids=[1,2,4,5];
    if(p.type==="tyt") ids=[1,4,5];
    ids.forEach(i=>{ const s=d.SESS[i-1]; list.push({mod:"M1",t:`${t("Buổi","Session")} ${s.id} · ${s.title}`,c:s.agenda.filter((a,k)=>k!==2).map(a=>a[1]).join(" · "),opt:s.hp===3}); });
  }
  if(p.m2 && p.type!=="tyt"){ (p.type==="pk"?d.PKS:d.M2S).forEach(s=>list.push({mod:"M2",t:s.t,c:s.c,opt:false})); }
  return {list,ft};
}

    <div class="small muted mt">${mod==="m1"?t("Theo buổi","By session"):t("Theo bài","By lesson")}: ${groups.map(g=>`<button class="btn ghost sm" style="margin:2px" onclick="startQuiz('${mod}','quiz','${g[0]}')">${g[1]}</button>`).join("")}</div>
  </div>
  <div id="quizBox" class="mt"></div>`;
}
function startQuiz(mod,mode,filter){
  let bank=bankOf(mod).map((q,i)=>({...q,_i:i}));
  if(filter!==undefined && filter!==null) bank=bank.filter(q=>String(q.s)===String(filter));
  const n = mode==="quiz"? Math.min(5,bank.length) : Math.min(20,bank.length);
  Q={mod,mode,idx:shuffle(bank).slice(0,n).map(q=>q._i),i:0,ans:[]};
  if(!$("quizBox")){ if(mod==="m1"){ S.m1Sub="quiz"; S.view="m1"; } else { S.m2Sub="quiz"; S.view="m2"; } save(); render(); }
  drawQuiz();
}
function qItems(){ const b=bankOf(Q.mod); return Q.idx.map(i=>b[i]); }
function drawQuiz(){
  const box=$("quizBox"); if(!box||!Q) return; const items=qItems(), it=items[Q.i], a=Q.ans[Q.i];
  const label={quiz:"Quiz",pre:"Pre-test",post:"Post-test"}[Q.mode];
  box.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="chip ${Q.mod==="m1"?"":"teal"}">${label} · ${Q.mod.toUpperCase()} · ${Q.mod==="m1"?t("Buổi ","Session ")+it.s:it.s}</span>${PLATE()}</div>
    <div class="progress mt"><i style="width:${pct(Q.i+1,items.length)}%"></i></div>
    <h3 class="mt" style="display:block">${t("Câu","Q")} ${Q.i+1}/${items.length}. ${it.q}</h3>
    ${it.o.map((o,k)=>{ let c=""; if(a!=null){ if(k===it.a) c="correct"; else if(k===a) c="wrong"; } return `<button class="qopt ${c}" ${a!=null?"disabled":""} onclick="pickAns(${k})">${String.fromCharCode(65+k)}. ${o}</button>`; }).join("")}
    ${a!=null?`<div class="explain">${a===it.a?OK()+" <b>"+t("Chính xác.","Correct.")+"</b>":NO()+" <b>"+t("Chưa đúng.","Not quite.")+"</b>"} ${it.e}</div>`:""}
    <div class="pill-row mt"><button class="btn ghost" ${Q.i===0?"disabled":""} onclick="Q.i--;drawQuiz()">← ${t("Trước","Prev")}</button>${Q.i<items.length-1?`<button class="btn" ${a==null?"disabled":""} onclick="Q.i++;drawQuiz()">${t("Tiếp","Next")} →</button>`:`<button class="btn gold" ${a==null?"disabled":""} onclick="finishQuiz()">${t("Nộp bài","Submit")}</button>`}</div></div>`;
}
function pickAns(k){ Q.ans[Q.i]=k; drawQuiz(); }
function finishQuiz(){
  const items=qItems(), correct=items.filter((it,i)=>Q.ans[i]===it.a).length, sc=pct(correct,items.length), mod=Q.mod;
  if(Q.mode==="quiz"){ S.quiz[mod].last=sc; S.quiz[mod].best=Math.max(S.quiz[mod].best??0,sc); }
  if(Q.mode==="pre") S.pre[mod]=sc; if(Q.mode==="post") S.post[mod]=sc;
  save();
  let extra="";
  if(Q.mode==="post" && S.pre[mod]!=null){ const dl=sc-S.pre[mod]; extra=`<div class="notice ${dl>=25?"teal":""} mt small">${t("Delta so với pre-test","Delta vs pre-test")}: <b>${dl>0?"+":""}${dl}</b> ${dl>=25?t("— đạt ngưỡng hiệu quả (≥25).","— meets the effectiveness threshold (≥25)."):t("— chưa đạt ngưỡng ≥25 điểm %.","— below the ≥25 threshold.")}</div>`; }
  if(mod==="m2" && Q.mode==="quiz") extra+=`<div class="notice mt small">${t("Tiêu chí Module 2: quiz ≥80%.","Module 2 criterion: quiz ≥80%.")} ${sc>=80?t("Đạt.","Pass."):t("Chưa đạt — ôn lại các bài liên quan.","Not yet — review related lessons.")}</div>`;
  $("quizBox").innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><h3>${ic("award")}${t("Kết quả","Result")}</h3>${PLATE()}</div><div class="kpi"><b>${sc}%</b><span>${correct}/${items.length} ${t("câu đúng","correct")}</span></div>${extra}
   <h4>${t("Xem lại","Review")}</h4>${items.map((it,i)=>`<div class="small" style="padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px"><span>${Q.ans[i]===it.a?OK():NO()}</span><span>${it.q}<br><span class="muted">${t("Đáp án","Answer")}: ${it.o[it.a]}</span></span></div>`).join("")}
   <div class="pill-row mt"><button class="btn" onclick="startQuiz('${mod}','${Q.mode}')">${t("Làm lại","Retry")}</button></div></div>`;
}

const AdminUI=(function(){
  const deny=()=>{ toast(t("Chỉ Admin mới có quyền này.","Admin only.")); return false; };
  const guard=()=>Auth.isAdmin();
  const me=()=>Auth.cur().u;
  const re=()=>render();
  function download(name,text,mime){ const b=new Blob([text],{type:mime||"application/json"}); const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); }
  const stamp=()=>new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
  return {
    tab(x){ if(!guard()) return deny(); A_TAB=x; re(); },
    addUser(){
      if(!guard()) return deny();
      const u=($("nuU").value||"").trim().toLowerCase(), name=($("nuN").value||"").trim(), role=$("nuR").value, p=$("nuP").value||"";
      if(!/^[a-z0-9][a-z0-9._-]{2,31}$/.test(u)) return toast(t("Tên đăng nhập 3–32 ký tự: a-z, 0-9, . _ -","Username 3–32 chars: a-z, 0-9, . _ -"));
      if(Auth.findAcc(u)) return toast(t("Tên đăng nhập đã tồn tại.","Username already exists."));
      if(!Auth.pwOk(u,p)) return toast(t("Mật khẩu tạm cần ≥ 8 ký tự, có chữ và số.","Temp password needs ≥ 8 chars with letters and digits."));
      const salt=Auth.newSalt(); Auth.db().accounts.push({u,name:name||u,role:role==="admin"?"admin":"user",salt,hash:Auth.hashPw(u,salt,p),active:true,mustChange:true,created:new Date().toISOString(),lastLogin:null});
      Auth.persist(); Auth.log("admin_add_user",`${u} (${role})`); re(); toast(t("Đã tạo tài khoản","Account created")+": "+u);
    },
    setRole(u,role){
      if(!guard()) return deny(); const a=Auth.findAcc(u); if(!a||u===me()) return re();
      if(a.role==="admin"&&role!=="admin"&&Auth.activeAdmins().length<=1){ toast(t("Phải còn ít nhất một Admin hoạt động.","At least one active admin must remain.")); return re(); }
      a.role=role==="admin"?"admin":"user"; Auth.persist(); Auth.log("admin_set_role",`${u} → ${a.role}`); re(); toast(t("Đã cập nhật vai trò","Role updated"));
    },
    toggleActive(u){
      if(!guard()) return deny(); const a=Auth.findAcc(u); if(!a||u===me()) return;
      if(a.active&&a.role==="admin"&&Auth.activeAdmins().length<=1){ return toast(t("Không thể khóa Admin cuối cùng.","Cannot disable the last admin.")); }
      a.active=!a.active; Auth.persist(); Auth.log(a.active?"admin_enable_user":"admin_disable_user",u); re();
    },
    resetPw(u){
      if(!guard()) return deny(); const a=Auth.findAcc(u); if(!a) return;
      const p=Auth.genPw(); a.salt=Auth.newSalt(); a.hash=Auth.hashPw(a.u,a.salt,p); a.mustChange=true; delete Auth.db().locks[a.u]; Auth.persist(); Auth.log("admin_reset_password",u); re();
      openModal(t("Mật khẩu tạm đã được đặt","Temporary password set"),`<p>${t("Tài khoản","Account")}: <b>${esc(a.u)}</b></p><div class="cred">${esc(p)}</div><p class="small muted">${t("Gửi mật khẩu này cho người dùng qua kênh an toàn. Họ sẽ phải đổi mật khẩu khi đăng nhập. Mật khẩu này không hiển thị lại.","Send this password through a safe channel. The user must change it at sign-in. It will not be shown again.")}</p>`);
    },
    askDel(u){
      if(!guard()) return deny(); if(u===me()) return;
      openModal(t("Xóa tài khoản?","Delete account?"),`<p>${t("Xóa vĩnh viễn tài khoản","Permanently delete account")} <b>${esc(u)}</b>?</p><button class="btn danger" onclick="AdminUI.doDel('${esc(u)}')">${t("Xóa","Delete")}</button>`);
    },
    doDel(u){
      if(!guard()) return deny(); const db=Auth.db(); const a=Auth.findAcc(u); if(!a||u===me()) return closeModal();
      if(a.role==="admin"&&a.active&&Auth.activeAdmins().length<=1){ closeModal(); return toast(t("Không thể xóa Admin cuối cùng.","Cannot delete the last admin.")); }
      db.accounts=db.accounts.filter(x=>x.u!==u); Auth.persist(); Auth.log("admin_delete_user",u); closeModal(); re();
    },
    saveFeat(){
      if(!guard()) return deny(); const db=Auth.db();
      Auth.VIEW_FLAGS.forEach(k=>{ db.flags.views[k]=$("fv_"+k).checked; }); db.flags.lab3d=$("fv_lab").checked;
      Auth.persist(); Auth.log("admin_features",JSON.stringify(db.flags)); re(); toast(t("Đã lưu cấu hình chức năng","Feature settings saved"));
    },
    saveNotice(){
      if(!guard()) return deny(); const db=Auth.db();
      db.notice={on:$("fnOn").checked,text:($("fnT").value||"").trim().slice(0,500),level:$("fnL").value}; Auth.persist(); Auth.log("admin_notice",db.notice.on?"on":"off"); re(); toast(t("Đã lưu thông báo","Notice saved"));
    },
    saveDoc(){
      if(!guard()) return deny(); const db=Auth.db();
      const title=($("lbT").value||"").trim(), url=($("lbU").value||"").trim(), desc=($("lbD").value||"").trim(), aud=$("lbA").value==="admin"?"admin":"all";
      if(!title) return toast(t("Cần nhập tiêu đề.","Title is required."));
      if(url&&!safeUrl(url)) return toast(t("Đường dẫn phải bắt đầu bằng http:// hoặc https://","URL must start with http:// or https://"));
      if(LIB_EDIT){ const d=db.docs.find(x=>x.id===LIB_EDIT); if(d){ Object.assign(d,{title,url,desc,aud}); } LIB_EDIT=null; Auth.log("admin_doc_edit",title); }
      else { db.docs.unshift({id:"d"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),title,url,desc,aud,by:me(),at:new Date().toISOString()}); Auth.log("admin_doc_add",title); }
      Auth.persist(); re(); toast(t("Đã lưu tài liệu","Document saved"));
    },
    editDoc(id){ if(!guard()) return deny(); LIB_EDIT=id; re(); window.scrollTo(0,0); },
    cancelDoc(){ LIB_EDIT=null; re(); },
    delDoc(id){ if(!guard()) return deny(); const db=Auth.db(); const d=db.docs.find(x=>x.id===id); db.docs=db.docs.filter(x=>x.id!==id); Auth.persist(); Auth.log("admin_doc_delete",d?d.title:id); re(); },
    exportAudit(){
      if(!guard()) return deny();
      const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
      const rows=[["time","account","event","detail"]].concat(Auth.db().audit.map(x=>[x.ts,x.u,x.ev,x.d||""]));
      download("nhat-ky-truy-cap-"+stamp()+".csv","﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n"),"text/csv;charset=utf-8");
    },
    askClearAudit(){ if(!guard()) return deny(); openModal(t("Xóa nhật ký?","Clear the log?"),`<p>${t("Xóa toàn bộ nhật ký truy cập trên trình duyệt này?","Delete the whole access log in this browser?")}</p><button class="btn danger" onclick="AdminUI.doClearAudit()">${t("Xóa","Delete")}</button>`); },
    doClearAudit(){ if(!guard()) return deny(); Auth.db().audit=[]; Auth.persist(); Auth.log("admin_clear_audit",""); closeModal(); re(); },
    exportBackup(){
      if(!guard()) return deny(); const db=Auth.db();
      const pack={app:"ipg-medtech-training",v:1,at:new Date().toISOString(),auth:{accounts:db.accounts,flags:db.flags,notice:db.notice,docs:db.docs},state:S};
      download("sao-luu-he-thong-"+stamp()+".json",JSON.stringify(pack,null,2)); Auth.log("admin_export_backup",""); toast(t("Đã xuất file sao lưu","Backup exported"));
    },
    importBackup(inp){
      if(!guard()) return deny(); const f=inp.files&&inp.files[0]; if(!f) return;
      if(f.size>5*1024*1024){ inp.value=""; return toast(t("File quá lớn.","File too large.")); }
      const rd=new FileReader();
      rd.onload=()=>{
        try{
          const p=JSON.parse(rd.result);
          if(!p||p.app!=="ipg-medtech-training"||!p.auth||!Array.isArray(p.auth.accounts)) throw new Error("format");
          const okAcc=p.auth.accounts.every(a=>a&&/^[a-z0-9][a-z0-9._-]{2,31}$/.test(a.u)&&(a.role==="admin"||a.role==="user")&&typeof a.hash==="string"&&typeof a.salt==="string");
          if(!okAcc||!p.auth.accounts.some(a=>a.role==="admin"&&a.active)) throw new Error("accounts");
          window.__pendingImport=p;
          openModal(t("Khôi phục từ sao lưu?","Restore from backup?"),`<p>${t("Thao tác này GHI ĐÈ tài khoản, cấu hình, tài liệu và tiến độ hiện tại bằng dữ liệu trong file. Sau đó bạn cần đăng nhập lại.","This OVERWRITES current accounts, settings, library and progress with the file's data. You will have to sign in again.")}</p><p class="small muted">${p.auth.accounts.length} ${t("tài khoản","accounts")} · ${esc(p.at||"")}</p><button class="btn danger" onclick="AdminUI.doImport()">${t("Khôi phục","Restore")}</button>`);
        }catch(e){ toast(t("File sao lưu không hợp lệ.","Invalid backup file.")); }
        inp.value="";
      };
      rd.readAsText(f);
    },
    doImport(){
      if(!guard()) return deny(); const p=window.__pendingImport; if(!p) return closeModal();
      try{
        const cur=Auth.db(); const keepAudit=cur.audit;
        const nd={v:1,accounts:p.auth.accounts,flags:p.auth.flags||cur.flags,notice:p.auth.notice||cur.notice,docs:(Array.isArray(p.auth.docs)?p.auth.docs:[]).filter(d=>d&&typeof d==="object").map((d,i)=>({id:/^[\w-]{1,40}$/.test(String(d.id))?String(d.id):"d"+i+Date.now().toString(36),title:String(d.title||"").slice(0,140),url:safeUrl(d.url),desc:String(d.desc||"").slice(0,1200),aud:d.aud==="admin"?"admin":"all",by:String(d.by||"").slice(0,32),at:String(d.at||"")})),audit:keepAudit,locks:{}};
        localStorage.setItem(Auth.KEY,JSON.stringify(nd));
        if(p.state&&typeof p.state==="object") localStorage.setItem(STORE_KEY,JSON.stringify(p.state));
        Auth.reloadFromStorage(); Auth.log("admin_restore_backup","");
        try{ sessionStorage.removeItem(Auth.SKEY); }catch(e){} location.reload();
      }catch(e){ toast(t("Không khôi phục được.","Restore failed.")); }
    }
  };
})();

    function rbox(w,h,d,r,color){ const s=new T.Shape(),x=-w/2,y=-h/2; s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r); s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h); s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r); s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); const g=new T.ExtrudeGeometry(s,{depth:d,bevelEnabled:false}); g.center(); const m=new T.Mesh(g,new T.MeshStandardMaterial({color,metalness:.45,roughness:.42})); m.castShadow=true; return m; }
    function label(target,text){ const c=document.createElement("canvas"); c.width=512; c.height=128; const g=c.getContext("2d"); g.fillStyle="rgba(5,17,29,.85)"; g.strokeStyle="rgba(217,174,54,.6)"; g.lineWidth=4; g.beginPath(); g.roundRect?g.roundRect(12,12,488,104,24):g.rect(12,12,488,104); g.fill(); g.stroke(); g.font="700 40px Be Vietnam Pro, Arial"; g.fillStyle="#dff8ff"; g.textAlign="center"; g.textBaseline="middle"; g.fillText(text,256,64); const tx=new T.CanvasTexture(c); tx.colorSpace=T.SRGBColorSpace; const sp=new T.Sprite(new T.SpriteMaterial({map:tx,transparent:true,depthTest:false})); sp.scale.set(1.8,.45,1); sp.position.set(0,.85,0); target.add(sp); labels.push(sp); }
    function reg(m,id,txt){ m.userData.id=id; m.userData.txt=txt; inter.push(m); named.set(id,m); }
    const G={}; ["tower","telepack","insufflator","esu","softscope"].forEach(k=>{ G[k]=new T.Group(); scene.add(G[k]); });
    const metal=new T.MeshStandardMaterial({color:0x6c8397,metalness:.82,roughness:.32}), dark=new T.MeshStandardMaterial({color:0x132131,metalness:.4,roughness:.5});
    let screenGlow, scopeTip;
    // Tower
    (function(){ const g=G.tower; const base=new T.Mesh(new T.CylinderGeometry(1.08,1.18,.16,48),new T.MeshStandardMaterial({color:0x2a3d51,metalness:.65,roughness:.38})); base.position.y=.08; g.add(base); reg(base,"tower","Tower nội soi"); label(base,"Tower");
      const post=new T.Mesh(new T.CylinderGeometry(.1,.1,3.7,20),metal); post.position.y=1.95; g.add(post);
      [[-.78,.04,-.54],[.82,.04,-.52],[0,.04,.84]].forEach(p=>{ const w=new T.Mesh(new T.CylinderGeometry(.14,.14,.1,18),dark); w.rotation.z=Math.PI/2; w.position.set(...p); g.add(w); });
      [1.0,1.95,2.92].forEach(y=>{ const sh=new T.Mesh(new T.BoxGeometry(1.55,.08,.88),metal); sh.position.set(0,y,0); g.add(sh); });
      const mon=rbox(1.85,.9,.12,.14,0x1a2c41); mon.position.set(0,3.85,.1); g.add(mon); reg(mon,"screen","Màn hình nội soi"); label(mon,"Monitor");
      screenGlow=new T.Mesh(new T.PlaneGeometry(1.48,.68),new T.MeshStandardMaterial({color:0x0a1520,emissive:0x0a1a24,emissiveIntensity:1.25})); screenGlow.position.set(0,3.85,.18); g.add(screenGlow);
      const cam=rbox(1.35,.46,.55,.08,0x24384e); cam.position.set(0,2.24,.02); g.add(cam); reg(cam,"camera","Camera Control Unit"); label(cam,"Camera");
      const ins=rbox(1.35,.46,.55,.08,0x24384e); ins.position.set(0,1.29,.02); g.add(ins); reg(ins,"insufflator","CO2 Insufflator"); label(ins,"CO2");
      const esu=rbox(1.35,.46,.55,.08,0x24384e); esu.position.set(0,.34,.02); g.add(esu); reg(esu,"esu","Dao điện cao tần"); label(esu,"ESU");
      [[.3,2.26,0x90e9ff],[.3,1.31,0x91f0ff],[.3,.36,0xffad70]].forEach(([z,y,c])=>{ const b=new T.Mesh(new T.PlaneGeometry(.66,.15),new T.MeshBasicMaterial({color:c,transparent:true,opacity:.45})); b.position.set(0,y,z); g.add(b); });
      const sc=new T.Mesh(new T.CylinderGeometry(.045,.045,1.56,18),metal); sc.rotation.z=Math.PI/2.9; sc.position.set(-1.55,2.15,.15); g.add(sc); reg(sc,"scope","Ống soi"); label(sc,"Scope");
      const cable=new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3([new T.Vector3(-1.18,2.3,.1),new T.Vector3(-.7,2.48,.2),new T.Vector3(-.3,2.45,.18),new T.Vector3(0,2.34,.2)]),24,.025,10,false),new T.MeshStandardMaterial({color:0x58cfff,emissive:0x0b6883,emissiveIntensity:.4})); g.add(cable); })();
    // Tele Pack+
    (function(){ const g=G.telepack; const b=rbox(2,1.2,.55,.16,0x23405a); b.position.set(0,1.8,0); g.add(b); reg(b,"telepack","Tele Pack+"); label(b,"Tele Pack+");
      const d=new T.Mesh(new T.PlaneGeometry(1.48,.7),new T.MeshStandardMaterial({color:0x14324b,emissive:0x53d3ff,emissiveIntensity:1.05})); d.position.set(0,1.88,.29); g.add(d);
      const st=new T.Mesh(new T.CylinderGeometry(.11,.11,1.4,18),metal); st.position.set(0,.82,0); g.add(st);
      const s=new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3([new T.Vector3(-1.2,1.5,.1),new T.Vector3(-1.5,1.85,.18),new T.Vector3(-1.7,1.75,.15),new T.Vector3(-1.55,1.35,.1)]),24,.03,12,false),new T.MeshStandardMaterial({color:0x8fdfff,emissive:0x117399,emissiveIntensity:.45})); g.add(s); reg(s,"scope","Scope kết nối"); })();
    // Insufflator
    (function(){ const g=G.insufflator; const b=rbox(2,.8,.8,.12,0x24415a); b.position.set(0,1.25,0); g.add(b); reg(b,"insufflator","ENDOFLATOR 50"); label(b,"ENDOFLATOR 50");
      const s=new T.Mesh(new T.PlaneGeometry(1,.2),new T.MeshBasicMaterial({color:0x90e9ff,transparent:true,opacity:.5})); s.position.set(0,1.3,.41); g.add(s);
      const h=new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3([new T.Vector3(1,1.15,.2),new T.Vector3(1.5,1.5,.3),new T.Vector3(1.9,1.2,.1),new T.Vector3(2.2,.9,0)]),30,.05,14,false),new T.MeshStandardMaterial({color:0x8fdfff,emissive:0x116d8a,emissiveIntensity:.4})); g.add(h); })();
    // ESU
    (function(){ const g=G.esu; const b=rbox(2.1,.8,.8,.12,0x24415a); b.position.set(0,1.25,0); g.add(b); reg(b,"esu","AUTOCON III 400"); label(b,"AUTOCON III 400");
      const o=new T.Mesh(new T.PlaneGeometry(.9,.18),new T.MeshBasicMaterial({color:0xffa860,transparent:true,opacity:.55})); o.position.set(0,1.28,.41); g.add(o);
      const fs=new T.Mesh(new T.BoxGeometry(.8,.12,.5),new T.MeshStandardMaterial({color:0x30485e})); fs.position.set(1.55,.12,.3); g.add(fs); })();
    // Soft scope
    (function(){ const g=G.softscope; g.position.y=.6; const hd=new T.Mesh(new T.BoxGeometry(.55,.3,.25),new T.MeshStandardMaterial({color:0x29455c})); hd.position.set(-1.3,1.1,0); g.add(hd); reg(hd,"scope","Video Endoscope"); label(hd,"Video Endoscope");
      const tb=new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3([new T.Vector3(-1,1.15,0),new T.Vector3(-.2,1.7,.12),new T.Vector3(.9,1.5,.1),new T.Vector3(1.45,1.15,0)]),60,.055,16,false),new T.MeshStandardMaterial({color:0x8fdfff,emissive:0x14789a,emissiveIntensity:.35})); g.add(tb);
      scopeTip=new T.Mesh(new T.SphereGeometry(.08,20,20),new T.MeshStandardMaterial({color:0x7ce4ff,emissive:0x39cbff,emissiveIntensity:.65})); scopeTip.position.set(1.45,1.15,0); g.add(scopeTip); })();

    const targets={tower:[0,1.95,0],telepack:[0,1.7,0],insufflator:[0,1.25,0],esu:[0,1.2,0],softscope:[0,1.25,0]};
    function show(){ Object.keys(G).forEach(k=>G[k].visible=(k===L.equip)); controls.target.set(...targets[L.equip]); }
    show();

    const el=renderer.domElement;
    function setMouse(ev){ const r=el.getBoundingClientRect(); mouse.x=((ev.clientX-r.left)/r.width)*2-1; mouse.y=-((ev.clientY-r.top)/r.height)*2+1; return r; }
    const visibleInter=()=>inter.filter(m=>{ let o=m; while(o){ if(o.visible===false) return false; o=o.parent; } return true; });
    el.addEventListener("pointermove",ev=>{ const r=setMouse(ev); ray.setFromCamera(mouse,camera); const h=ray.intersectObjects(visibleInter(),false); const tip=host&&host.querySelector("#labTip"); if(!tip) return; if(h.length){ tip.style.display="block"; tip.style.left=(ev.clientX-r.left)+"px"; tip.style.top=(ev.clientY-r.top)+"px"; tip.textContent=nm(h[0].object.userData); el.style.cursor="pointer"; } else { tip.style.display="none"; el.style.cursor="grab"; } });
    let downAt=null; el.addEventListener("pointerdown",ev=>{ downAt=[ev.clientX,ev.clientY]; });
    el.addEventListener("pointerup",ev=>{ if(!downAt||Math.hypot(ev.clientX-downAt[0],ev.clientY-downAt[1])>5) return; setMouse(ev); ray.setFromCamera(mouse,camera); const h=ray.intersectObjects(visibleInter(),false); if(h.length){ const id=h[0].object.userData.id; L.focusId=id; pulse(id); log(tt("Đang xem: ","Viewing: ")+nm(h[0].object.userData)+"."); } });

    if(VRButton && navigator.xr){ try{ const vb=VRButton.createButton(renderer); vb.style.zIndex=4; vb.style.bottom="auto"; vb.style.top="70px"; ctx_vr=vb; }catch(e){} }
    renderer.xr.addEventListener("sessionstart",()=>log(tt("Đã vào chế độ WebXR VR.","Entered WebXR VR mode.")));
    renderer.xr.addEventListener("sessionend",()=>log(tt("Thoát chế độ WebXR VR.","Exited WebXR VR mode.")));
    // Bộ điều khiển VR: chọn thiết bị bằng tia
    const c1=renderer.xr.getController(0), c2=renderer.xr.getController(1); scene.add(c1,c2);
    const line=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(0,0,0),new T.Vector3(0,0,-1)]),new T.LineBasicMaterial({color:0xd9ae36})); line.scale.z=5; c1.add(line.clone()); c2.add(line.clone());
    const tm=new T.Matrix4(); [c1,c2].forEach(c=>c.addEventListener("selectstart",()=>{ tm.identity().extractRotation(c.matrixWorld); ray.ray.origin.setFromMatrixPosition(c.matrixWorld); ray.ray.direction.set(0,0,-1).applyMatrix4(tm); const h=ray.intersectObjects(visibleInter(),false); if(h.length){ L.focusId=h[0].object.userData.id; pulse(L.focusId); log("VR select: "+nm(h[0].object.userData)+"."); } }));

    function pulse(id){ const m=named.get(id); if(m) m.userData.pulse=1; if(L.focusId!==id){ L.focusId=id; } }
    function screenOn(){ screenGlow.material.color.setHex(0x14324b); screenGlow.material.emissive.setHex(0x3cbef0); }
    function tip(d){ if(scopeTip) scopeTip.userData.t=d; }
    function resize(){ const v=host&&host.querySelector("#labView"); if(!v) return; const w=v.clientWidth,h=v.clientHeight; renderer.setSize(w,h,false); el.style.width=w+"px"; el.style.height=h+"px"; camera.aspect=w/h; camera.updateProjectionMatrix(); }
    function loop(t){
      controls.update();
      named.forEach(m=>{ if(m.userData.pulse){ m.userData.pulse=Math.max(0,m.userData.pulse-.03); const p=1+Math.sin(t*.02)*.06*m.userData.pulse; m.scale.set(p,p,p); } else m.scale.lerp(new T.Vector3(1,1,1),.12); });
      labels.forEach(l=>l.visible=L.labels);
      if(scopeTip){ const tg=scopeTip.userData.t||0; scopeTip.position.y+=(1.15+tg-scopeTip.position.y)*.08; scopeTip.position.z+=(tg*.22-scopeTip.position.z)*.08; }
      acc.intensity=12+Math.sin(t*.0015)*2.2;
      if(L.running) G[L.equip].rotation.y+=.0012;
      if(L.alarm){ const on=Math.floor(t/400)%2===0; named.forEach((m,id)=>{ if(id==="insufflator"||id==="esu") m.material.emissive&&m.material.emissive.setHex(on?0x5a0d0d:0x000000); }); }
      else named.forEach((m,id)=>{ if(id==="insufflator"||id==="esu") m.material.emissive&&m.material.emissive.setHex(0x000000); });
      renderer.render(scene,camera);
    }
    return {renderer, show, pulse, screenOn, tip, resize, loop, get vr(){ return ctx_vr; }, set vr(v){ ctx_vr=v; }};
  }

  async function mount(el){
    host=el; mounted=true; shell();
    if(!ctx) await initThree();
    if(!ctx || !mounted || host!==el) return;
    const view=host.querySelector("#labView"); const msg=host.querySelector("#labMsg"); if(msg) msg.remove();
    view.appendChild(ctx.renderer.domElement);
    if(ctx.vr && navigator.xr && navigator.xr.isSessionSupported){ navigator.xr.isSessionSupported("immersive-vr").then(ok=>{ if(ok && mounted) view.appendChild(ctx.vr); }).catch(()=>{}); }
    ctx.show(); ctx.resize();
    if(ro) ro.disconnect(); ro=new ResizeObserver(()=>ctx.resize()); ro.observe(view);
    ctx.renderer.setAnimationLoop(ctx.loop);
  }
  function unmount(){ mounted=false; if(ctx) ctx.renderer.setAnimationLoop(null); if(ro){ ro.disconnect(); ro=null; } }
  return {mount, unmount};
})();
// Nếu người dùng đã ở tab Lab trước khi module này sẵn sàng
if(window.APP && window.APP.S.view==="m2" && window.APP.S.m2Sub==="lab"){ const el=document.getElementById("labMount"); if(el) window.M2Lab.mount(el); }

</script>
